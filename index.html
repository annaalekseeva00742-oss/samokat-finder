<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<meta name="theme-color" content="#FFFFFF">
<title>Поиск Самокатов</title>
<link rel="manifest" href="manifest.json">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Yandex+Sans+Text:wght@400;500;600;700&display=swap');
  
  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    font-family: 'Yandex Sans Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  
  body {
    background: #F5F5F5;
    color: #000;
    padding: 16px;
    min-height: 100vh;
    padding-bottom: 100px;
  }

  .profile-section {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .profile-avatar {
    width: 51px;
    height: 51px;
    border-radius: 50%;
  }

  .profile-name {
    font-size: 25px;
    font-weight: 700;
    color: #000;
  }

  .scooter-header {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #FFFFFF;
    padding: 16px 20px;
    border-radius: 16px;
    margin-bottom: 16px;
  }

  .scooter-icon {
    width: 44px;
    height: 44px;
  }

  .scooter-title {
    font-size: 20px;
    font-weight: 600;
    color: #000;
    cursor: pointer;
  }

  .rewards-card {
    background: #FFFFFF;
    padding: 16px 20px;
    border-radius: 16px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .rewards-content {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .rewards-star {
    width: 34px;
    height: 34px;
  }

  .rewards-text {
    font-size: 16px;
    color: #000;
  }

  .rewards-subtext {
    font-size: 13px;
    color: #999;
    margin-top: 2px;
  }

  .rewards-arrow {
    color: #999;
    font-size: 20px;
  }

  .action-button {
    background: #FFFFFF;
    padding: 18px 20px;
    border-radius: 16px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    border: none;
    width: 100%;
    font-size: 17px;
    font-weight: 500;
    color: #000;
    transition: background 0.2s;
  }

  .action-button:active {
    background: #F0F0F0;
  }

  .action-button-content {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .action-icon-wrapper {
    width: 43px;
    height: 43px;
    background: #F0F0F0;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .action-icon {
    width: 22px;
    height: 22px;
    object-fit: contain;
  }

  .action-arrow {
    color: #999;
    font-size: 20px;
  }

  .street-section {
    background: #FFFFFF;
    padding: 20px;
    border-radius: 16px;
    margin-bottom: 16px;
  }

  .street-label {
    font-size: 17px;
    font-weight: 500;
    color: #000;
    margin-bottom: 16px;
    line-height: 1.5;
  }

  .street-sublabel {
    font-size: 13px;
    color: #999;
    font-weight: 400;
  }

  .street-input {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    background: #F5F5F5;
    outline: none;
    transition: all 0.2s;
    min-height: 96px;
    resize: none;
    display: block;
  }

  .street-input:focus {
    border: 2px solid #FFCC00;
    background: #FFFFFF;
  }

  .street-input::placeholder {
    color: #999;
  }

  .photo-card {
    background: #FFFFFF;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    min-height: 280px;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .photo-placeholder {
    color: #999;
    font-size: 15px;
  }

  .photo-card img.photo-preview {
    width: 100%;
    border-radius: 12px;
    object-fit: cover;
  }

  #gameCanvas {
    width: 100%;
    height: 320px;
    background: #000;
    border-radius: 12px;
    display: block;
    touch-action: none;
  }

  .submit-btn {
    background: #FFCC00;
    color: #000;
    border: none;
    padding: 18px 20px;
    border-radius: 16px;
    font-size: 17px;
    font-weight: 600;
    width: 100%;
    cursor: pointer;
    margin-bottom: 12px;
    transition: opacity 0.2s;
  }

  .submit-btn:active {
    opacity: 0.8;
  }

  .submit-btn:disabled {
    background: #E0E0E0;
    color: #999;
    cursor: not-allowed;
  }

  .retake-btn {
    background: #e5e4e2;
    color: #000;
    border: none;
    padding: 16px 20px;
    border-radius: 16px;
    font-size: 17px;
    font-weight: 500;
    width: 100%;
    cursor: pointer;
    margin-bottom: 20px;
    transition: background 0.2s;
  }

  .retake-btn:active {
    background: #dcdad8;
  }

  .logout-btn {
    background: #FFFFFF;
    padding: 18px 20px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    border: none;
    width: 100%;
    font-size: 17px;
    font-weight: 500;
    color: #000;
    transition: background 0.2s;
    margin-bottom: 20px;
  }

  .logout-btn:active {
    background: #F0F0F0;
  }

  .logout-btn-content {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logout-icon-wrapper {
    width: 43px;
    height: 43px;
    background: #F0F0F0;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logout-icon {
    width: 18px;
    height: 18px;
    object-fit: contain;
  }

  .logout-arrow {
    color: #999;
    font-size: 20px;
  }

  .hidden {
    display: none !important;
  }

  #status {
    margin: 12px 0;
    font-size: 14px;
    text-align: center;
  }
  .ok { color: #16a34a; }
  .err { color: #dc2626; }
</style>
</head>
<body>

<div class="profile-section">
  <img src="icons/logoprofil.png" alt="Профиль" class="profile-avatar">
  <div class="profile-name">Пользователь</div>
</div>

<div class="scooter-header">
  <img src="icons/logosamokat.png" alt="Самокат" class="scooter-icon">
  <div class="scooter-title" id="scooterTitle">Нашёл Самокат ?</div>
</div>

<div class="rewards-card">
  <div class="rewards-content">
    <img src="icons/star.png" alt="Звезда" class="rewards-star">
    <div>
      <div class="rewards-text">100 Баллов</div>
      <div class="rewards-subtext">Баллы = Рубли</div>
    </div>
  </div>
  <div class="rewards-arrow">›</div>
</div>

<button class="action-button" id="cameraBtn">
  <div class="action-button-content">
    <div class="action-icon-wrapper">
      <img src="icons/camera.svg" alt="Камера" class="action-icon">
    </div>
    <span>Сфотографировать</span>
  </div>
  <div class="action-arrow">›</div>
</button>

<button class="action-button" id="galleryBtn">
  <div class="action-button-content">
    <div class="action-icon-wrapper">
      <img src="icons/gallery.svg" alt="Галерея" class="action-icon">
    </div>
    <span>Загрузить из галереи</span>
  </div>
  <div class="action-arrow">›</div>
</button>

<input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
<input type="file" id="fileInput" accept="image/*" style="display: none;">

<div class="street-section" id="streetSection">
  <div class="street-label">Название улицы:<br><span class="street-sublabel">(рядом с которой обнаружен самокат)</span></div>
  <textarea class="street-input" id="street" placeholder="Например: ул. Ленина, 15" rows="3"></textarea>
</div>

<div class="photo-card" id="photoCard">
  <canvas id="gameCanvas" class="hidden"></canvas>
  <div class="photo-placeholder" id="photoPlaceholder">Здесь появится фото</div>
  <img id="photoPreview" class="photo-preview" style="display: none;">
</div>

<button class="submit-btn" id="sendBtn">Отправить</button>

<button class="retake-btn hidden" id="retakeBtn">Переснять</button>

<button class="logout-btn" id="logoutBtn">
  <div class="logout-btn-content">
    <div class="logout-icon-wrapper">
      <img src="icons/logout.png" alt="Выход" class="logout-icon">
    </div>
    <span>Выход</span>
  </div>
  <div class="logout-arrow">›</div>
</button>

<div id="status"></div>

<script>
const BOT_TOKEN = '8803648566:AAHmG4XTMTDqfIHlWjBeDsKCGmQ18pxKnGQ';
const CHAT_ID   = '7929131842';

const photoCard = document.getElementById('photoCard');
const photoPlaceholder = document.getElementById('photoPlaceholder');
const photoPreview = document.getElementById('photoPreview');
const cameraBtn = document.getElementById('cameraBtn');
const galleryBtn = document.getElementById('galleryBtn');
const cameraIn = document.getElementById('cameraInput');
const fileIn = document.getElementById('fileInput');
const streetIn = document.getElementById('street');
const streetSection = document.getElementById('streetSection');
const sendBtn = document.getElementById('sendBtn');
const retakeBtn = document.getElementById('retakeBtn');
const logoutBtn = document.getElementById('logoutBtn');
const status = document.getElementById('status');
const scooterTitle = document.getElementById('scooterTitle');
const gameCanvas = document.getElementById('gameCanvas');

let currentFile = null;

// ===== ИГРА =====
let gameActive = false;
let ctx, canvasW, canvasH, dpr;
let player, bullets, enemies, particles, stars;
let score, taps, lastTapTime, torpedoMode, torpedoTimer, torpedoCooldown;
let lastTime, enemySpawnTimer, animFrame;

function initCanvas() {
  dpr = window.devicePixelRatio || 1;
  const rect = gameCanvas.getBoundingClientRect();
  canvasW = rect.width;
  canvasH = rect.height;
  gameCanvas.width = canvasW * dpr;
  gameCanvas.height = canvasH * dpr;
  ctx = gameCanvas.getContext('2d');
  ctx.scale(dpr, dpr);
}

function startGame() {
  if (gameActive) return;
  gameActive = true;
  
  // Скрываем элементы
  cameraBtn.classList.add('hidden');
  galleryBtn.classList.add('hidden');
  streetSection.classList.add('hidden');
  retakeBtn.classList.add('hidden');
  photoPlaceholder.style.display = 'none';
  photoPreview.style.display = 'none';
  gameCanvas.classList.remove('hidden');
  photoCard.style.display = 'block';
  
  scooterTitle.textContent = 'Космо Бой 2.0';
  sendBtn.textContent = 'Закончить Игру';
  
  // Инициализация игры
  initCanvas();
  player = { x: canvasW / 2, y: canvasH - 50, w: 30, h: 30, speed: 0 };
  bullets = [];
  enemies = [];
  particles = [];
  stars = [];
  for (let i = 0; i < 50; i++) {
    stars.push({ x: Math.random() * canvasW, y: Math.random() * canvasH, s: Math.random() * 2 + 0.5, sp: Math.random() * 2 + 1 });
  }
  score = 0;
  taps = [];
  torpedoMode = false;
  torpedoTimer = 0;
  torpedoCooldown = 0;
  enemySpawnTimer = 0;
  lastTime = performance.now();
  
  animFrame = requestAnimationFrame(gameLoop);
}

function endGame() {
  gameActive = false;
  cancelAnimationFrame(animFrame);
  
  // Возвращаем элементы
  cameraBtn.classList.remove('hidden');
  galleryBtn.classList.remove('hidden');
  streetSection.classList.remove('hidden');
  retakeBtn.classList.remove('hidden');
  gameCanvas.classList.add('hidden');
  
  scooterTitle.textContent = 'Нашёл Самокат ?';
  sendBtn.textContent = 'Отправить';
  
  // Возвращаем карточку фото в исходное состояние
  if (currentFile) {
    photoPreview.style.display = 'block';
  } else {
    photoPlaceholder.style.display = 'block';
    photoCard.style.display = 'none';
  }
}

function shoot() {
  const now = Date.now();
  taps.push(now);
  taps = taps.filter(t => now - t < 1500);
  
  // Проверка на торпеды
  if (!torpedoMode && torpedoCooldown <= 0 && taps.length >= 5) {
    torpedoMode = true;
    torpedoTimer = 5000;
    taps = [];
  }
  
  if (torpedoMode) {
    bullets.push({ x: player.x, y: player.y - 15, vx: 0, vy: -10, type: 'torpedo', dmg: 3, size: 6 });
  } else {
    bullets.push({ x: player.x, y: player.y - 15, vx: 0, vy: -8, type: 'bullet', dmg: 1, size: 3 });
  }
}

function spawnEnemy() {
  const hp = Math.floor(Math.random() * 3) + 2;
  enemies.push({
    x: Math.random() * (canvasW - 40) + 20,
    y: -20,
    w: 28,
    h: 28,
    hp: hp,
    maxHp: hp,
    vy: 1.5 + Math.random() * 1.5
  });
}

function explode(x, y, color) {
  for (let i = 0; i < 12; i++) {
    const angle = (Math.PI * 2 * i) / 12;
    const speed = 2 + Math.random() * 3;
    particles.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 30,
      color: color,
      size: 2 + Math.random() * 2
    });
  }
}

function gameLoop(now) {
  const dt = Math.min(now - lastTime, 50);
  lastTime = now;
  
  // Очистка
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvasW, canvasH);
  
  // Звёзды
  stars.forEach(s => {
    s.y += s.sp;
    if (s.y > canvasH) { s.y = 0; s.x = Math.random() * canvasW; }
    ctx.fillStyle = '#fff';
    ctx.fillRect(s.x, s.y, s.s, s.s);
  });
  
  // Таймеры торпед
  if (torpedoMode) {
    torpedoTimer -= dt;
    if (torpedoTimer <= 0) {
      torpedoMode = false;
      torpedoCooldown = 30000;
    }
  }
  if (torpedoCooldown > 0) {
    torpedoCooldown -= dt;
  }
  
  // Спавн врагов
  enemySpawnTimer -= dt;
  if (enemySpawnTimer <= 0) {
    spawnEnemy();
    enemySpawnTimer = 1200 + Math.random() * 800;
  }
  
  // Пули
  bullets.forEach(b => { b.x += b.vx; b.y += b.vy; });
  bullets = bullets.filter(b => b.y > -10 && b.y < canvasH + 10);
  
  // Враги
  enemies.forEach(e => { e.y += e.vy; });
  
  // Коллизии пуля-враг
  bullets.forEach(b => {
    enemies.forEach(e => {
      if (Math.abs(b.x - e.x) < e.w/2 + b.size && Math.abs(b.y - e.y) < e.h/2 + b.size) {
        e.hp -= b.dmg;
        b.y = -100;
        explode(b.x, b.y, '#ff0');
        if (e.hp <= 0) {
          score += 10;
          explode(e.x, e.y, '#f80');
          e.y = canvasH + 100;
        }
      }
    });
  });
  enemies = enemies.filter(e => e.y < canvasH + 50 && e.hp > 0);
  
  // Game over если враг долетел до низа
  if (enemies.some(e => e.y > canvasH - 20)) {
    endGame();
    return;
  }
  
  // Частицы
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    p.vx *= 0.95;
    p.vy *= 0.95;
  });
  particles = particles.filter(p => p.life > 0);
  
  // Рисуем частицы
  particles.forEach(p => {
    ctx.globalAlpha = p.life / 30;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  });
  ctx.globalAlpha = 1;
  
  // Рисуем пули
  bullets.forEach(b => {
    if (b.type === 'torpedo') {
      ctx.fillStyle = '#f40';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
      ctx.fill();
      // trail
      ctx.fillStyle = 'rgba(255,100,0,0.3)';
      ctx.beginPath();
      ctx.arc(b.x, b.y + 8, b.size * 1.5, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = '#ff0';
      ctx.fillRect(b.x - 1, b.y - 4, 2, 8);
    }
  });
  
  // Рисуем врагов с HP баром
  enemies.forEach(e => {
    // Тело
    ctx.fillStyle = '#c33';
    ctx.fillRect(e.x - e.w/2, e.y - e.h/2, e.w, e.h);
    ctx.strokeStyle = '#f66';
    ctx.lineWidth = 2;
    ctx.strokeRect(e.x - e.w/2, e.y - e.h/2, e.w, e.h);
    
    // HP бар
    const barW = e.w + 4;
    const barH = 4;
    const barX = e.x - barW/2;
    const barY = e.y - e.h/2 - 8;
    ctx.fillStyle = '#333';
    ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = '#0f0';
    ctx.fillRect(barX, barY, barW * (e.hp / e.maxHp), barH);
  });
  
  // Рисуем игрока
  ctx.fillStyle = '#0af';
  ctx.beginPath();
  ctx.moveTo(player.x, player.y - 15);
  ctx.lineTo(player.x - 15, player.y + 15);
  ctx.lineTo(player.x + 15, player.y + 15);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.stroke();
  
  // HUD
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('Счёт: ' + score, 10, 24);
  
  if (torpedoMode) {
    ctx.fillStyle = '#f40';
    ctx.textAlign = 'center';
    ctx.fillText('🔥 ТОРПЕДЫ: ' + Math.ceil(torpedoTimer/1000) + 'с', canvasW/2, 24);
  } else if (torpedoCooldown > 0) {
    ctx.fillStyle = '#888';
    ctx.textAlign = 'center';
    ctx.fillText('Торпеды: ' + Math.ceil(torpedoCooldown/1000) + 'с', canvasW/2, 24);
  } else {
    ctx.fillStyle = '#0f0';
    ctx.textAlign = 'center';
    ctx.fillText('Тапай быстро для торпед!', canvasW/2, 24);
  }
  
  animFrame = requestAnimationFrame(gameLoop);
}

// Управление canvas
let touchStartX = 0, touchStartY = 0, touchStartTime = 0, isDragging = false;

gameCanvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  const rect = gameCanvas.getBoundingClientRect();
  touchStartX = t.clientX - rect.left;
  touchStartY = t.clientY - rect.top;
  touchStartTime = Date.now();
  isDragging = false;
}, { passive: false });

gameCanvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!gameActive) return;
  const t = e.touches[0];
  const rect = gameCanvas.getBoundingClientRect();
  const x = t.clientX - rect.left;
  const y = t.clientY - rect.top;
  const dx = x - touchStartX;
  const dy = y - touchStartY;
  if (Math.abs(dx) > 10 || Math.abs(dy) > 10) isDragging = true;
  if (isDragging) {
    player.x = Math.max(15, Math.min(canvasW - 15, x));
  }
}, { passive: false });

gameCanvas.addEventListener('touchend', e => {
  e.preventDefault();
  const dt = Date.now() - touchStartTime;
  if (!isDragging && dt < 300 && gameActive) {
    shoot();
  }
}, { passive: false });

// Активация игры по 4 кликам
let clickCount = 0;
let clickTimer = null;
scooterTitle.addEventListener('click', () => {
  if (gameActive) return;
  clickCount++;
  clearTimeout(clickTimer);
  clickTimer = setTimeout(() => { clickCount = 0; }, 2000);
  if (clickCount >= 4) {
    startGame();
    clickCount = 0;
  }
});

// Кнопка отправить / закончить игру
sendBtn.addEventListener('click', async () => {
  if (gameActive) {
    endGame();
    return;
  }
  
  status.className = '';
  if (!currentFile) { 
    status.textContent = 'Сначала сделайте фото'; 
    status.className='err'; 
    return; 
  }
  if (!streetIn.value.trim()) { 
    status.textContent = 'Укажите улицу'; 
    status.className='err'; 
    return; 
  }

  sendBtn.disabled = true;
  status.textContent = 'Отправляем...';

  try {
    const fd = new FormData();
    fd.append('chat_id', CHAT_ID);
    fd.append('photo', currentFile);
    fd.append('caption', `📍 Улица: ${streetIn.value.trim()}\n🕒 ${new Date().toLocaleString('ru-RU')}`);

    const r1 = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
      method: 'POST', 
      body: fd
    });
    const j1 = await r1.json();
    if (!j1.ok) throw new Error(j1.description || 'Ошибка отправки фото');

    const r2 = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        chat_id: CHAT_ID,
        text: `🛴 Новая находка\n📍 ${streetIn.value.trim()}\n🕒 ${new Date().toLocaleString('ru-RU')}`
      })
    });
    const j2 = await r2.json();
    if (!j2.ok) throw new Error(j2.description);

    status.textContent = 'Отправлено! Спасибо';
    status.className = 'ok';
    clearPreview();
    streetIn.value = '';
  } catch (err) {
    status.textContent = 'Ошибка: ' + err.message;
    status.className = 'err';
  } finally {
    sendBtn.disabled = false;
  }
});

function showPreview(file) {
  currentFile = file;
  const reader = new FileReader();
  reader.onload = e => {
    photoPlaceholder.style.display = 'none';
    photoPreview.src = e.target.result;
    photoPreview.style.display = 'block';
    photoCard.style.display = 'block';
  };
  reader.readAsDataURL(file);
}

function clearPreview() {
  currentFile = null;
  photoPlaceholder.style.display = 'block';
  photoPreview.src = '';
  photoPreview.style.display = 'none';
  cameraIn.value = '';
  fileIn.value = '';
  status.textContent = '';
  if (!gameActive) photoCard.style.display = 'none';
}

cameraBtn.addEventListener('click', () => { cameraIn.click(); });
galleryBtn.addEventListener('click', () => { fileIn.click(); });
cameraIn.addEventListener('change', e => { if (e.target.files[0]) showPreview(e.target.files[0]); });
fileIn.addEventListener('change', e => { if (e.target.files[0]) showPreview(e.target.files[0]); });
retakeBtn.addEventListener('click', clearPreview);

logoutBtn.addEventListener('click', () => {
  if (gameActive) endGame();
  if (navigator.app) {
    navigator.app.exitApp();
  } else {
    window.close();
    setTimeout(() => { alert('Закройте вкладку браузера для выхода из приложения'); }, 100);
  }
});
</script>
</body>
</html>
