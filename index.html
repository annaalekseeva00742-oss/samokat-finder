<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FFFFFF">
<title>Поиск Самокатов</title>
<link rel="manifest" href="manifest.json">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Yandex+Sans+Text:wght@400;500;600;700&display=swap');
  
  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    font-family: 'Yandex Sans Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  
  body {
    background: #F5F5F5;
    color: #000;
    padding: 16px;
    min-height: 100vh;
    padding-bottom: 100px;
  }

  /* Профиль */
  .profile-section {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .profile-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
  }

  .profile-name {
    font-size: 28px;
    font-weight: 700;
    color: #000;
  }

  /* Заголовок с самокатом */
  .scooter-header {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #FFFFFF;
    padding: 16px 20px;
    border-radius: 16px;
    margin-bottom: 16px;
  }

  .scooter-icon {
    width: 60px;
    height: 60px;
  }

  .scooter-title {
    font-size: 22px;
    font-weight: 600;
    color: #000;
  }

  /* Баллы */
  .rewards-card {
    background: #FFFFFF;
    padding: 16px 20px;
    border-radius: 16px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .rewards-content {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .rewards-star {
    width: 32px;
    height: 32px;
  }

  .rewards-text {
    font-size: 16px;
    color: #000;
  }

  .rewards-subtext {
    font-size: 13px;
    color: #999;
    margin-top: 2px;
  }

  .rewards-arrow {
    color: #999;
    font-size: 20px;
  }

  /* Карточка для фото */
  .photo-card {
    background: #FFFFFF;
    border-radius: 16px;
    padding: 40px 20px;
    margin-bottom: 16px;
    min-height: 280px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .photo-placeholder {
    color: #999;
    font-size: 18px;
  }

  .photo-card img.photo-preview {
    width: 100%;
    border-radius: 12px;
    object-fit: cover;
  }

  /* Кнопки действий */
  .action-button {
    background: #FFFFFF;
    padding: 18px 20px;
    border-radius: 16px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    border: none;
    width: 100%;
    font-size: 17px;
    color: #000;
    transition: background 0.2s;
  }

  .action-button:active {
    background: #F0F0F0;
  }

  .action-button-content {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .action-icon {
    width: 48px;
    height: 48px;
    object-fit: contain;
  }

  .action-arrow {
    color: #999;
    font-size: 20px;
  }

  /* Поле ввода улицы */
  .street-section {
    background: #FFFFFF;
    padding: 20px;
    border-radius: 16px;
    margin-bottom: 16px;
  }

  .street-label {
    font-size: 17px;
    font-weight: 500;
    color: #000;
    margin-bottom: 4px;
  }

  .street-sublabel {
    font-size: 13px;
    color: #999;
    margin-bottom: 12px;
  }

  .street-input {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid #E0E0E0;
    border-radius: 12px;
    font-size: 16px;
    background: #FAFAFA;
    outline: none;
  }

  .street-input:focus {
    border-color: #FFCC00;
    background: #FFFFFF;
  }

  /* Информационный блок */
  .info-box {
    background: #F5F5F5;
    padding: 12px 16px;
    border-radius: 10px;
    margin-top: 12px;
    font-size: 13px;
    color: #666;
    line-height: 1.5;
  }

  /* Кнопка отправить */
  .submit-btn {
    background: #FFCC00;
    color: #000;
    border: none;
    padding: 18px 20px;
    border-radius: 16px;
    font-size: 17px;
    font-weight: 600;
    width: 100%;
    cursor: pointer;
    margin-bottom: 12px;
    transition: opacity 0.2s;
  }

  .submit-btn:active {
    opacity: 0.8;
  }

  .submit-btn:disabled {
    background: #E0E0E0;
    color: #999;
    cursor: not-allowed;
  }

  /* Кнопка переснять */
  .retake-btn {
    background: #F0F0F0;
    color: #000;
    border: none;
    padding: 16px 20px;
    border-radius: 16px;
    font-size: 17px;
    font-weight: 500;
    width: 100%;
    cursor: pointer;
    margin-bottom: 20px;
    transition: background 0.2s;
  }

  .retake-btn:active {
    background: #E0E0E0;
  }

  /* Кнопка выход */
  .logout-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 16px;
    color: #000;
    width: 100%;
  }

  .logout-icon {
    width: 48px;
    height: 48px;
    object-fit: contain;
  }

  #status {
    margin: 12px 0;
    font-size: 14px;
    text-align: center;
  }
  .ok { color: #16a34a; }
  .err { color: #dc2626; }
</style>
</head>
<body>

<!-- Профиль -->
<div class="profile-section">
  <img src="icons/logoprofil.png" alt="Профиль" class="profile-avatar">
  <div class="profile-name">Андрей</div>
</div>

<!-- Заголовок с самокатом -->
<div class="scooter-header">
  <img src="icons/logosamokat.png" alt="Самокат" class="scooter-icon">
  <div class="scooter-title">Нашёл Самокат ?</div>
</div>

<!-- Баллы -->
<div class="rewards-card">
  <div class="rewards-content">
    <img src="icons/star.png" alt="Звезда" class="rewards-star">
    <div>
      <div class="rewards-text">100</div>
      <div class="rewards-subtext">Баллы = Рубли</div>
    </div>
  </div>
  <div class="rewards-arrow">›</div>
</div>

<!-- Карточка для фото -->
<div class="photo-card" id="photoCard">
  <div class="photo-placeholder" id="photoPlaceholder">Здесь появится фото</div>
  <img id="photoPreview" class="photo-preview" style="display: none;">
</div>

<!-- Кнопки действий -->
<button class="action-button" onclick="document.getElementById('cameraInput').click()">
  <div class="action-button-content">
    <img src="icons/camera.png" alt="Камера" class="action-icon">
    <span>Сфотографировать</span>
  </div>
  <div class="action-arrow">›</div>
</button>

<button class="action-button" onclick="document.getElementById('fileInput').click()">
  <div class="action-button-content">
    <img src="icons/gallery.png" alt="Галерея" class="action-icon">
    <span>Загрузить из галереи</span>
  </div>
  <div class="action-arrow">›</div>
</button>

<input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
<input type="file" id="fileInput" accept="image/*" style="display: none;">

<!-- Поле ввода улицы -->
<div class="street-section">
  <label class="street-label">Название улицы:</label>
  <div class="street-sublabel">(рядом с которой обнаружен самокат)</div>
  <input type="text" class="street-input" id="street" placeholder="Например: ул. Ленина, 15">
  
  <div class="info-box">
    кликабельное поле нажав можно вводить комментарий<br>
    этот текст в интерфейс не добавил я просто объясняю что тут будет
  </div>
</div>

<!-- Кнопка отправить -->
<button class="submit-btn" id="sendBtn">Отправить</button>

<!-- Кнопка переснять -->
<button class="retake-btn" id="retakeBtn">Переснять</button>

<!-- Кнопка выход -->
<button class="logout-btn">
  <img src="icons/logout.png" alt="Выход" class="logout-icon">
  <span>Выход</span>
</button>

<div id="status"></div>

<script>
// ===== ВСТАВЬ СЮДА СВОИ ДАННЫЕ =====
const BOT_TOKEN = '8803648566:AAHmG4XTMTDqfIHlWjBeDsKCGmQ18pxKnGQ';
const CHAT_ID   = '7929131842';
// ===================================

const photoCard = document.getElementById('photoCard');
const photoPlaceholder = document.getElementById('photoPlaceholder');
const photoPreview = document.getElementById('photoPreview');
const cameraIn = document.getElementById('cameraInput');
const fileIn = document.getElementById('fileInput');
const streetIn = document.getElementById('street');
const sendBtn = document.getElementById('sendBtn');
const retakeBtn = document.getElementById('retakeBtn');
const status = document.getElementById('status');

let currentFile = null;

function showPreview(file) {
  currentFile = file;
  const reader = new FileReader();
  reader.onload = e => {
    photoPlaceholder.style.display = 'none';
    photoPreview.src = e.target.result;
    photoPreview.style.display = 'block';
  };
  reader.readAsDataURL(file);
}

function clearPreview() {
  currentFile = null;
  photoPlaceholder.style.display = 'block';
  photoPreview.src = '';
  photoPreview.style.display = 'none';
  cameraIn.value = '';
  fileIn.value = '';
  status.textContent = '';
}

cameraIn.addEventListener('change', e => {
  if (e.target.files[0]) showPreview(e.target.files[0]);
});

fileIn.addEventListener('change', e => {
  if (e.target.files[0]) showPreview(e.target.files[0]);
});

retakeBtn.addEventListener('click', clearPreview);

sendBtn.addEventListener('click', async () => {
  status.className = '';
  if (!currentFile) { 
    status.textContent = 'Сначала сделайте фото'; 
    status.className='err'; 
    return; 
  }
  if (!streetIn.value.trim()) { 
    status.textContent = 'Укажите улицу'; 
    status.className='err'; 
    return; 
  }

  sendBtn.disabled = true;
  status.textContent = 'Отправляем...';

  try {
    const fd = new FormData();
    fd.append('chat_id', CHAT_ID);
    fd.append('photo', currentFile);
    fd.append('caption', `📍 Улица: ${streetIn.value.trim()}\n🕒 ${new Date().toLocaleString('ru-RU')}`);

    const r1 = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
      method: 'POST', 
      body: fd
    });
    const j1 = await r1.json();
    if (!j1.ok) throw new Error(j1.description || 'Ошибка отправки фото');

    const r2 = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        chat_id: CHAT_ID,
        text: `🛴 Новая находка\n📍 ${streetIn.value.trim()}\n🕒 ${new Date().toLocaleString('ru-RU')}`
      })
    });
    const j2 = await r2.json();
    if (!j2.ok) throw new Error(j2.description);

    status.textContent = 'Отправлено! Спасибо';
    status.className = 'ok';
    clearPreview();
    streetIn.value = '';
  } catch (err) {
    status.textContent = 'Ошибка: ' + err.message;
    status.className = 'err';
  } finally {
    sendBtn.disabled = false;
  }
});
</script>
</body>
</html>
